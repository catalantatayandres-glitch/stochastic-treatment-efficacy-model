<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The monthly cycle of the model: six events repeated every month for 120 months">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A4A22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" rx="18" fill="#FBF5EC"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#5A2E14">The monthly cycle</text>
  <text x="860" y="44" font-size="14" fill="#8A6A55" text-anchor="end">same order, both species, every month</text>

  <!-- arrows -->
  <g stroke="#8A4A22" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="282" y1="122" x2="326" y2="122"/>
    <line x1="572" y1="122" x2="616" y2="122"/>
    <line x1="740" y1="172" x2="740" y2="226"/>
    <line x1="618" y1="282" x2="574" y2="282"/>
    <line x1="328" y1="282" x2="284" y2="282"/>
    <line x1="160" y1="232" x2="160" y2="176"/>
  </g>
  <text x="450" y="207" font-size="14" fill="#8A6A55" text-anchor="middle" font-style="italic">one month</text>

  <!-- 1 -->
  <g transform="translate(40,74)">
    <rect width="240" height="96" rx="12" fill="#FFFFFF" stroke="#C8692E" stroke-width="2"/>
    <circle cx="30" cy="48" r="17" fill="#C8692E"/><text x="30" y="54" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="58" y="42" font-size="17" font-weight="700" fill="#3B2010">Reproduction</text>
    <text x="58" y="64" font-size="13" fill="#6B5444">Logistic growth, reduced</text>
    <text x="58" y="80" font-size="13" fill="#6B5444">by competition</text>
  </g>
  <!-- 2 -->
  <g transform="translate(330,74)">
    <rect width="240" height="96" rx="12" fill="#FFFFFF" stroke="#C8692E" stroke-width="2"/>
    <circle cx="30" cy="48" r="17" fill="#C8692E"/><text x="30" y="54" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="58" y="42" font-size="17" font-weight="700" fill="#3B2010">Natural mortality</text>
    <text x="58" y="64" font-size="13" fill="#6B5444">Fixed monthly risk</text>
    <text x="58" y="80" font-size="13" fill="#6B5444">of death</text>
  </g>
  <!-- 3 -->
  <g transform="translate(620,74)">
    <rect width="240" height="96" rx="12" fill="#FFFFFF" stroke="#C8692E" stroke-width="2"/>
    <circle cx="30" cy="48" r="17" fill="#C8692E"/><text x="30" y="54" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="58" y="42" font-size="17" font-weight="700" fill="#3B2010">Disease transmission</text>
    <text x="58" y="64" font-size="13" fill="#6B5444">Invasive carriers infect</text>
    <text x="58" y="80" font-size="13" fill="#6B5444">susceptible natives</text>
  </g>
  <!-- 4 -->
  <g transform="translate(620,234)">
    <rect width="240" height="96" rx="12" fill="#EEF3FB" stroke="#2F57A6" stroke-width="2.5"/>
    <circle cx="30" cy="48" r="17" fill="#2F57A6"/><text x="30" y="54" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="58" y="42" font-size="17" font-weight="700" fill="#1D3566">Defensive strategy</text>
    <text x="58" y="64" font-size="13" fill="#4A5A78">Protein protects infected</text>
    <text x="58" y="80" font-size="13" fill="#4A5A78">natives from plague death</text>
  </g>
  <!-- 5 -->
  <g transform="translate(330,234)">
    <rect width="240" height="96" rx="12" fill="#FBEFEA" stroke="#A8321E" stroke-width="2.5"/>
    <circle cx="30" cy="48" r="17" fill="#A8321E"/><text x="30" y="54" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="58" y="42" font-size="17" font-weight="700" fill="#6B1C10">Disarming strategy</text>
    <text x="58" y="64" font-size="13" fill="#7A4A40">RNAi kills invasive</text>
    <text x="58" y="80" font-size="13" fill="#7A4A40">carriers only</text>
  </g>
  <!-- 6 -->
  <g transform="translate(40,234)">
    <rect width="240" height="96" rx="12" fill="#FFFFFF" stroke="#C8692E" stroke-width="2"/>
    <circle cx="30" cy="48" r="17" fill="#C8692E"/><text x="30" y="54" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="58" y="42" font-size="17" font-weight="700" fill="#3B2010">Record &amp; advance</text>
    <text x="58" y="64" font-size="13" fill="#6B5444">Store the counts and</text>
    <text x="58" y="80" font-size="13" fill="#6B5444">start the next month</text>
  </g>

  <text x="450" y="372" font-size="14" fill="#8A6A55" text-anchor="middle">Repeated 12 times a year for 10 years (120 months) · every event is a random draw</text>
</svg>
